name: Next Turn

# Opens a "your turn" issue for the next player in PLAYERS.md whenever a turn
# merges, and checks hourly whether the current player's time is up.
# The logic lives in .github/scripts/next_turn.py. It always runs from main,
# so a player's PR can't change it.

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: next-turn
  cancel-in-progress: false

jobs:
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pass the turn
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I .github/scripts/next_turn.py
